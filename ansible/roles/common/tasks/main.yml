---
- name: apt update & upgrade
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - gnupg
      - ca-certificates
      - apt-transport-https
      - software-properties-common
      - net-tools
    state: present

- name: Disable swap (current session)
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap entries from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules (overlay, br_netfilter)
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load overlay module immediately
  modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module immediately
  modprobe:
    name: br_netfilter
    state: present

- name: Configure sysctl parameters for k8s
  copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"

- name: Apply sysctl settings
  command: sysctl --system
  changed_when: false
