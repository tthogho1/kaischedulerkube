---
- name: Check whether kubeadm join has already run
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeadm_join_done

- name: Determine path to the generated join script
  set_fact:
    join_script_local: "{{ playbook_dir }}/../.generated/kubeadm-join.sh"

- name: Check whether the join script exists locally
  delegate_to: localhost
  become: false
  stat:
    path: "{{ join_script_local }}"
  register: join_script_stat

- name: Fail if the join script cannot be found
  fail:
    msg: >
      Could not find the kubeadm join script ({{ join_script_local }}).
      Run the control-plane playbook first.
  when: not join_script_stat.stat.exists and not kubeadm_join_done.stat.exists

- name: Copy join script to the worker
  copy:
    src: "{{ join_script_local }}"
    dest: /tmp/kubeadm-join.sh
    mode: "0700"
  when: not kubeadm_join_done.stat.exists

- name: Run kubeadm join
  command: bash /tmp/kubeadm-join.sh
  when: not kubeadm_join_done.stat.exists
