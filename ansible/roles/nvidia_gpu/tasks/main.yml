---
- name: Create /etc/apt/keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Check whether the NVIDIA driver is already installed
  command: nvidia-smi
  register: nvidia_smi_check
  failed_when: false
  changed_when: false

- name: Install ubuntu-drivers-common
  apt:
    name: ubuntu-drivers-common
    state: present
    update_cache: true
  when: nvidia_smi_check.rc != 0

- name: Auto-install the recommended NVIDIA driver
  command: ubuntu-drivers autoinstall
  when: nvidia_smi_check.rc != 0
  register: nvidia_driver_install

- name: Reboot to load the NVIDIA driver
  reboot:
    reboot_timeout: 600
  when: nvidia_driver_install.changed | default(false)

- name: Fetch NVIDIA container toolkit GPG key
  get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

- name: Add NVIDIA container toolkit apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /"
    filename: nvidia-container-toolkit
    state: present

- name: Install nvidia-container-toolkit
  apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Configure the NVIDIA runtime for containerd
  # --set-as-default is required: without it, containerd keeps using plain
  # runc for every pod (including the NVIDIA device plugin DaemonSet itself,
  # since nothing here defines a RuntimeClass or sets runtimeClassName), so
  # no pod ever gets /dev/nvidia* or libnvidia-ml.so mounted and the device
  # plugin silently registers zero GPUs even though it stays Running.
  command: nvidia-ctk runtime configure --runtime=containerd --set-as-default
  register: nvidia_ctk_configure
  # Always report changed: nvidia-ctk's success output varies across versions
  # (older versions log "Wrote ..."; 1.20.0 only logs INFO/ERRO lines with no
  # such marker), so string-matching stdout is unreliable and previously
  # caused this task to report "ok" and silently skip the containerd restart
  # below, leaving containerd running with the old (runc-default) config even
  # though the on-disk config was correct.
  changed_when: true
  notify: restart containerd

- meta: flush_handlers

- name: Verify with nvidia-smi
  command: nvidia-smi
  changed_when: false
