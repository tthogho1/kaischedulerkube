---
# Kubernetes
kubernetes_version: "1.29"
kubernetes_apt_version: "1.29.*"
pod_network_cidr: "192.168.0.0/16"
calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/calico.yaml"
nvidia_device_plugin_manifest_url: "https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.15.0/deployments/static/nvidia-device-plugin.yml"

ssh_private_key_file: "~/.ssh/id_rsa"
join_command_file: "/tmp/{{ project_name | default('kai-k8s') }}-kubeadm-join.sh"

# KAI Scheduler (https://github.com/NVIDIA/KAI-Scheduler)
# Open source — no tenant/license/pull secret required, so it installs as-is.
kai_install_enabled: true
kai_scheduler_chart: "oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler"
kai_scheduler_version: "v0.20.1"          # see https://github.com/kai-scheduler/KAI-Scheduler/releases
# v0.17.1's bundled topologies.kai.scheduler CRD has CEL validation rules the
# k8s 1.29.15 API server rejects (estimated rule cost exceeds budget); v0.20.1
# replaced that custom CRD with a simpler vendored Kueue topology CRD.
kai_scheduler_namespace: "kai-scheduler"
# GPU sharing (fractional GPUs). Needs the NVIDIA GPU Operator, not just the
# device plugin, so it is off by default in this setup.
kai_gpu_sharing_enabled: false
kai_helm_timeout: "10m"
# Every pod needs a leaf queue; these give a ready-to-use unlimited one.
kai_create_default_queues: true
kai_parent_queue_name: "default-parent-queue"
kai_queue_name: "default-queue"
kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
